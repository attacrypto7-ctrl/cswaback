# Railway monorepo config — Backend (NestJS API)
# Set di Railway Dashboard:
#   Root Directory  → back
#   Build Command   → (pakai yang di bawah)
#   Start Command   → (pakai yang di bawah)

[build]
builder = "nixpacks"
buildCommand = "npm install && npm run build:libs && npm run build -w cs-ai-api"

[deploy]
startCommand = "npm run start:api"
healthcheckPath = "/api"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
